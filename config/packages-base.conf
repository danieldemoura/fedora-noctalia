@hardware-support

# Gerenciamento de Energia e Bateria
tuned
tuned-ppd
upower
brightnessctl

# Tratamento de Entrada (Touchpad, Teclado, Mouse)
libinput
libinput-utils

# Servidor Multimídia e Áudio (PipeWire)
